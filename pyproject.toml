[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulumi-hetzner-k8s-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-command>=1.1.3",
    "pulumi-hcloud>=1.32.0",
    "pulumiverse-talos==0.6.1",  # Pin to 0.6.1 for Talos 1.11.2 compatibility
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "ty>=0.0.14",
]

[tool.ty]
[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [".venv/**"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
